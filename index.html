<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <script>
        // Step A: Parse browser header parameters immediately
        const urlArgs = new URLSearchParams(window.location.search);
        const targetIcon = (urlArgs.get('icon') || 'std').toLowerCase();
        const currentSwf = urlArgs.get('swf') || '';

        // Step B: Set the page title to the appropriate variant layout immediately
        const gameNames = {
          "ctp": "Crossing the Pit",
          "btb": "Breaking the Bank",
          "etp": "Escaping the Prison",
          "std": "Stealing the Diamond",
          "ita": "Infiltrating the Airship",
          "ftc": "Fleeing the Complex"
        };
        document.title = gameNames[targetIcon] || "SWF Player";

        // Step C: Link directly to a real, un-tampered physical configuration file
        // This ensures Chrome handles asset routes relative to your actual website directory!
        const manifestLink = document.createElement('link');
        manifestLink.id = 'app-manifest';
        manifestLink.rel = 'manifest';
        manifestLink.href = `${targetIcon}.json`;
        document.head.appendChild(manifestLink);

        // Step D: Register a physical root background pipeline worker 
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
          });
        }
    </script>

    <style>
        /* Force absolute viewport boundaries across modern mobile browsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Target the automatically generated ruffle-player element styling */
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        // Set up global definitions
        window.RufflePlayer = window.RufflePlayer || {};
        
        // FIX: Global configuration blocks internal SWF "noScale" bypass commands
        window.RufflePlayer.config = {
            scale: "showAll",       // Keeps original proportions without stretching characters
            forceScale: true,       // Forcefully blocks 'noScale' scripts inside Henry Stickmin
            letterbox: "on",        // Fills remaining space with the specified background color
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("load", () => {
            if (currentSwf) {
                const ruffle = window.RufflePlayer?.newest();
                
                if (!ruffle) {
                    document.body.innerHTML = "<div style='color: #ff3b30; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Ruffle Engine Load Failed</div>";
                    return;
                }

                const absoluteUrl = new URL(currentSwf, window.location.href).href;
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                player.load({
                    url: absoluteUrl,
                    allowScriptAccess: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf&icon=std</div>";
            }
        });
    </script>
</body>
</html>
