<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWF Player</title>
    <style>
        /* Eliminate all borders, padding, scrollbars, and browser elements */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #player {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Load the official standalone Ruffle player script -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                // Safely convert a relative file name into an absolute URL matching your domain
                const resolvedUrl = new URL(swfParam, window.location.href).href;

                const ruffle = window.RufflePlayer.newest();
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                // Initialize the game with pure full-screen aspect configurations
                player.load({
                    url: resolvedUrl,
                    allowScriptAccess: true,
                    backgroundColor: "#000000",
                    scale: "showAll",
                    letterbox: "on",
                    forceScale: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #888888; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%; font-size: 16px;'>Usage: ?swf=filename.swf</div>";
            }
        });
    </script>
</body>
</html>
