<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SWF Player</title>
    <style>
        /* Force absolute viewport boundaries across modern mobile browsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Target the automatically generated ruffle-player element styling */
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        // Set up global definitions
        window.RufflePlayer = window.RufflePlayer || {};
        
        // FIX: Global configuration blocks internal SWF "noScale" bypass commands
        window.RufflePlayer.config = {
            scale: "showAll",       // Keeps original proportions without stretching characters
            forceScale: true,       // Forcefully blocks 'noScale' scripts inside Henry Stickmin
            letterbox: "on",        // Fills remaining space with the specified background color
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                const ruffle = window.RufflePlayer?.newest();
                
                if (!ruffle) {
                    document.body.innerHTML = "<div style='color: #ff3b30; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Ruffle Engine Load Failed</div>";
                    return;
                }

                const absoluteUrl = new URL(swfParam, window.location.href).href;
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                player.load({
                    url: absoluteUrl,
                    allowScriptAccess: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf</div>";
            }
        });
    </script>
<!-- Fully Translucent Overlay Container -->
<div id="qte-container" style="
    position: fixed; 
    bottom: 40px; 
    left: 50%; 
    transform: translateX(-50%); 
    display: none; 
    gap: 20px; 
    z-index: 2147483647; 
    pointer-events: none;
">
    <!-- Buttons restore pointer events so they can be tapped -->
    <button id="btn-r" style="pointer-events: auto; width: 70px; height: 70px; background: rgba(0,0,0,0.85); color: white; border: 2px solid white; border-radius: 50%; font-size: 28px; font-weight: bold; -webkit-user-select: none; user-select: none;">R</button>
    <button id="btn-k" style="pointer-events: auto; width: 70px; height: 70px; background: rgba(0,0,0,0.85); color: white; border: 2px solid white; border-radius: 50%; font-size: 28px; font-weight: bold; -webkit-user-select: none; user-select: none;">K</button>
    <button id="btn-space" style="pointer-events: auto; width: 120px; height: 70px; background: rgba(0,0,0,0.85); color: white; border: 2px solid white; border-radius: 35px; font-size: 20px; font-weight: bold; -webkit-user-select: none; user-select: none;">SPACE</button>
</div>

<script>
    (function() {
        const qteContainer = document.getElementById('qte-container');

        // Verify file matches your target layout from the address search criteria
        const urlParams = new URLSearchParams(window.location.search);
        const activeSwf = urlParams.get('swf') || "";

        // Completely exit if the file string is not Stealing the Diamond
        if (!activeSwf.toLowerCase().includes('stealingthediamond')) {
            return;
        }

        // Keyboard event factory targeting the custom elements safely
        function triggerKey(keyChar, keyCode) {
            const player = document.querySelector('ruffle-player') || document.querySelector('#player') || window;
            const target = player.shadowRoot?.activeElement || player;
            
            ['keydown', 'keyup'].forEach(eventType => {
                target.dispatchEvent(new KeyboardEvent(eventType, {
                    key: keyChar,
                    code: keyChar === ' ' ? 'Space' : 'Key' + keyChar.toUpperCase(),
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true,
                    cancelable: true
                }));
            });
        }

        // Mobile touch hooks with browser default suppression
        document.getElementById('btn-r').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('r', 82); });
        document.getElementById('btn-k').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('k', 75); });
        document.getElementById('btn-space').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey(' ', 32); });

        // Event listener to watch for touch choices on the main game canvas area
        window.addEventListener('touchstart', function(e) {
            // If the overlay buttons are already up, don't restart tracking timers
            if (qteContainer.style.display === 'flex') return;

            // When a user taps the screen, check if they are touching the top half or coordinate boundaries
            // This detects the menu option selection area for the "Bust In" button placement
            const touchY = e.touches[0].clientY;
            const screenHeight = window.innerHeight;

            // "Bust In" is typically positioned near the upper quadrant of the option screen
            if (touchY < (screenHeight * 0.6)) {
                // Wait exactly 4.2 seconds for the scooter intro animation to play out
                setTimeout(() => {
                    qteContainer.style.display = 'flex';
                    
                    // Keep buttons active for exactly 11 seconds (duration of the scooter path QTE) then clear
                    setTimeout(() => {
                        qteContainer.style.display = 'none';
                    }, 11000);

                }, 4200); 
            }
        });
    })();
</script>
</body>
</html>
