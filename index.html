<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
    <link id="app-manifest" rel="manifest" href="manifest.json">

  <script>
    // Step B: Extract the custom parameters from the browser header
    const urlArgs = new URLSearchParams(window.location.search);
    const targetIcon = urlArgs.get('icon') || 'std';

    const gameNames = {
      "etp": "Escaping the Prison",
      "std": "Stealing the Diamond",
      "ita": "Infiltrating the Airship",
      "ftc": "Fleeing the Complex"
    };

    const assignedName = gameNames[targetIcon.toLowerCase()] || gameNames["std"];

    // Step C: Intercept and overwrite manifest records before installation triggers
    fetch('manifest.json')
      .then(response => response.json())
      .then(manifestData => {
        manifestData.name = assignedName;
        manifestData.short_name = assignedName;
        
        // This ensures clicking the desktop icon remembers your chosen parameter string
        manifestData.start_url = `/index.html?icon=${targetIcon}`;
        manifestData.id = `/?game=${targetIcon}`;
        
        // Maps the icon correctly to your local assets folder directory
        manifestData.icons.forEach(img => {
          img.src = `icons/${targetIcon}-ios.png`;
        });

        // Convert the modified object back into an active page link element
        const modifiedBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('app-manifest').setAttribute('href', URL.createObjectURL(modifiedBlob));
      });

    // Step D: Spin up a physical file worker so Chrome opens a true standalone frame
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
    <title>SWF Player</title>
    <style>
        /* Force absolute viewport boundaries across modern mobile browsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Target the automatically generated ruffle-player element styling */
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        // Set up global definitions
        window.RufflePlayer = window.RufflePlayer || {};
        
        // FIX: Global configuration blocks internal SWF "noScale" bypass commands
        window.RufflePlayer.config = {
            scale: "showAll",       // Keeps original proportions without stretching characters
            forceScale: true,       // Forcefully blocks 'noScale' scripts inside Henry Stickmin
            letterbox: "on",        // Fills remaining space with the specified background color
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                const ruffle = window.RufflePlayer?.newest();
                
                if (!ruffle) {
                    document.body.innerHTML = "<div style='color: #ff3b30; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Ruffle Engine Load Failed</div>";
                    return;
                }

                const absoluteUrl = new URL(swfParam, window.location.href).href;
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                player.load({
                    url: absoluteUrl,
                    allowScriptAccess: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf</div>";
            }
        });
    </script>
</body>
</html>
