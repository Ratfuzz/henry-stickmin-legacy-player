<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SWF Player</title>
    <style>
        /* Force absolute viewport boundaries across modern mobile browsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Target the automatically generated ruffle-player element styling */
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        // Set up global definitions
        window.RufflePlayer = window.RufflePlayer || {};
        
        // FIX: Global configuration blocks internal SWF "noScale" bypass commands
        window.RufflePlayer.config = {
            scale: "showAll",       // Keeps original proportions without stretching characters
            forceScale: true,       // Forcefully blocks 'noScale' scripts inside Henry Stickmin
            letterbox: "on",        // Fills remaining space with the specified background color
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                const ruffle = window.RufflePlayer?.newest();
                
                if (!ruffle) {
                    document.body.innerHTML = "<div style='color: #ff3b30; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Ruffle Engine Load Failed</div>";
                    return;
                }

                const absoluteUrl = new URL(swfParam, window.location.href).href;
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                player.load({
                    url: absoluteUrl,
                    allowScriptAccess: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf</div>";
            }
        });
    </script><!-- Native Input Box Overlay Container (Bottom-Right) -->
<div id="qte-container" style="
    position: fixed; 
    bottom: 20px; 
    right: 20px; 
    display: none; 
    z-index: 2147483647;
">
    <!-- Real text input box styled to look like an instruction label -->
    <input type="text" id="game-keyboard-trigger" placeholder="TAP HERE FOR QTE KEYS" readonly style="
        width: 180px;
        height: 50px;
        background: rgba(0,0,0,0.85);
        color: #fff;
        border: 1.5px solid #fff;
        border-radius: 25px;
        text-align: center;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        outline: none;
        -webkit-appearance: none;
    ">
</div>

<script>
    (function() {
        const qteContainer = document.getElementById('qte-container');
        const inputTrigger = document.getElementById('game-keyboard-trigger');

        // Target check for Stealing the Diamond parameters
        const urlParams = new URLSearchParams(window.location.search);
        const activeSwf = urlParams.get('swf') || "";
        
        if (activeSwf.toLowerCase().includes('stealingthediamondgame.swf')) {
            qteContainer.style.display = 'block';
        } else {
            return;
        }

        // Tap action forces standard native iOS focus 
        inputTrigger.addEventListener('touchstart', function(e) {
            // Remove readonly state immediately during touch event loop
            inputTrigger.removeAttribute('readonly');
            inputTrigger.focus();
        });

        // Whenever the user taps any button on their system layout, pass the input straight to Ruffle
        inputTrigger.addEventListener('input', function(e) {
            const player = document.querySelector('ruffle-player');
            if (!player) return;

            // Grab the last typed text character
            const lastChar = inputTrigger.value.slice(-1).toLowerCase();
            
            // Map character to matching virtual codes
            let keyCode = 0;
            if (lastChar === 'k') keyCode = 75;
            if (lastChar === 'r') keyCode = 82;
            if (lastChar === ' ') keyCode = 32;

            if (keyCode > 0) {
                // Focus Ruffle container immediately before executing
                player.focus();

                // Fire events down Ruffle's key tracker
                ['keydown', 'keyup'].forEach(eventType => {
                    player.dispatchEvent(new KeyboardEvent(eventType, {
                        key: lastChar,
                        code: lastChar === ' ' ? 'Space' : 'Key' + lastChar.toUpperCase(),
                        keyCode: keyCode,
                        which: keyCode,
                        bubbles: true,
                        cancelable: true,
                        composed: true
                    }));
                });
            }

            // Wipe out input value field clean to keep capturing typing strokes endlessly
            inputTrigger.value = '';
            
            // Re-assert focus immediately back onto input to keep keyboard frame from collapsing
            setTimeout(() => {
                inputTrigger.focus();
            }, 10);
        });
    })();
</script>
</body>
</html>
