<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <script>
        // 1. Handle manifest file selection separately at the top
        const urlArgs = new URLSearchParams(window.location.search);
        const targetIcon = (urlArgs.get('icon') || 'std').toLowerCase();

        const gameNames = {
          "ctp": "Crossing the Pit",
          "btb": "Breaking the Bank", 
          "etp": "Escaping the Prison",
          "std": "Stealing the Diamond",
          "ita": "Infiltrating the Airship",
          "ftc": "Fleeing the Complex"
        };
        document.title = gameNames[targetIcon] || "SWF Player";

        const manifestLink = document.createElement('link');
        manifestLink.id = 'app-manifest';
        manifestLink.rel = 'manifest';
        manifestLink.href = `${targetIcon}.json`;
        document.head.appendChild(manifestLink);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js');
          });
        }
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            scale: "showAll",       
            forceScale: true,       
            letterbox: "on",        
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        // FIX: Replaced window load with a listener that polls for the active script state
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                // Check if Ruffle API is present on the window object
                if (!window.RufflePlayer || typeof window.RufflePlayer.newest !== "function") {
                    // Fallback polling loop if script loading lags behind execution
                    const checkInterval = setInterval(() => {
                        if (window.RufflePlayer && typeof window.RufflePlayer.newest === "function") {
                            clearInterval(checkInterval);
                            initRufflePlayer(swfParam);
                        }
                    }, 100);
                } else {
                    initRufflePlayer(swfParam);
                }
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf</div>";
            }
        });

        // Modular loading controller function
        function initRufflePlayer(swfUrl) {
            const ruffle = window.RufflePlayer.newest();
            const absoluteUrl = new URL(swfUrl, window.location.href).href;
            const player = ruffle.createPlayer();
            
            document.getElementById("player").appendChild(player);
            player.load({
                url: absoluteUrl,
                allowScriptAccess: true
            });
        }
    </script>
</body>
</html>
