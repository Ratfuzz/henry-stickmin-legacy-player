<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SWF Player</title>
    <style>
        /* Force absolute viewport boundaries across modern mobile browsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Target the automatically generated ruffle-player element styling */
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        // Set up global definitions
        window.RufflePlayer = window.RufflePlayer || {};
        
        // FIX: Global configuration blocks internal SWF "noScale" bypass commands
        window.RufflePlayer.config = {
            scale: "showAll",       // Keeps original proportions without stretching characters
            forceScale: true,       // Forcefully blocks 'noScale' scripts inside Henry Stickmin
            letterbox: "on",        // Fills remaining space with the specified background color
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                const ruffle = window.RufflePlayer?.newest();
                
                if (!ruffle) {
                    document.body.innerHTML = "<div style='color: #ff3b30; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Ruffle Engine Load Failed</div>";
                    return;
                }

                const absoluteUrl = new URL(swfParam, window.location.href).href;
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                player.load({
                    url: absoluteUrl,
                    allowScriptAccess: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf</div>";
            }
        });
    </script>
   <!-- Fully Translucent Overlay Container -->
<div id="qte-container" style="
    position: fixed; 
    bottom: 40px; 
    left: 50%; 
    transform: translateX(-50%); 
    display: none; 
    gap: 20px; 
    z-index: 2147483647; 
    pointer-events: none;
">
    <!-- Buttons restore pointer events so they can be tapped -->
    <button id="btn-r" style="pointer-events: auto; width: 70px; height: 70px; background: rgba(0,0,0,0.8); color: white; border: 2px solid white; border-radius: 50%; font-size: 28px; font-weight: bold;">R</button>
    <button id="btn-k" style="pointer-events: auto; width: 70px; height: 70px; background: rgba(0,0,0,0.8); color: white; border: 2px solid white; border-radius: 50%; font-size: 28px; font-weight: bold;">K</button>
    <button id="btn-space" style="pointer-events: auto; width: 120px; height: 70px; background: rgba(0,0,0,0.8); color: white; border: 2px solid white; border-radius: 35px; font-size: 20px; font-weight: bold;">SPACE</button>
</div>

<script>
    (function() {
        const qteContainer = document.getElementById('qte-container');

        // Virtual keyboard event injection logic
        function triggerKey(keyChar, keyCode) {
            const player = document.querySelector('ruffle-player');
            const target = player ? (player.shadowRoot?.activeElement || player) : window;
            
            ['keydown', 'keyup'].forEach(eventType => {
                target.dispatchEvent(new KeyboardEvent(eventType, {
                    key: keyChar,
                    code: keyChar === ' ' ? 'Space' : 'Key' + keyChar.toUpperCase(),
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true,
                    cancelable: true
                }));
            });
        }

        // Instant touch responses to guarantee tight QTE timing windows on iOS
        document.getElementById('btn-r').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('r', 82); });
        document.getElementById('btn-k').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('k', 75); });
        document.getElementById('btn-space').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey(' ', 32); });

        // High-performance engine polling loop to look for the scooter frames
        function trackFlashFrames() {
            const ruffle = document.querySelector('ruffle-player');
            if (!ruffle) {
                setTimeout(trackFlashFrames, 250); // Re-poll if player isn't in DOM yet
                return;
            }

            setInterval(() => {
                try {
                    // Check if a file is loaded and fetch its filename from the Ruffle configuration or path attribute
                    const currentSwf = ruffle.getAttribute('swf') || ruffle.config?.file || "";
                    
                    // Stop executing and keep hidden if it is not the Stealing the Diamond file
                    if (!currentSwf.toLowerCase().includes('stealingthediamondgame.swf')) {
                        if (qteContainer.style.display !== 'none') {
                            qteContainer.style.display = 'none';
                        }
                        return;
                    }

                    // Check for the active emulated swf instance and grab frame index
                    if (ruffle.instance && typeof ruffle.instance.get_current_frame === 'function') {
                        const currentFrame = ruffle.instance.get_current_frame();
                        
                        // Stealing the Diamond "Bust In" Scooter scene window boundary frames
                        if (currentFrame >= 180 && currentFrame <= 420) {
                            if (qteContainer.style.display !== 'flex') {
                                qteContainer.style.display = 'flex';
                            }
                        } else {
                            if (qteContainer.style.display !== 'none') {
                                qteContainer.style.display = 'none';
                            }
                        }
                    }
                } catch (err) {
                    // Fail silently during player instantiation transitions
                }
            }, 50); // Checks 20 times a second for lightning-fast overlay presentation
        }

        // Initialize tracking as soon as document layout parses
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', trackFlashFrames);
        } else {
            trackFlashFrames();
        }
    })();
</script> 
</body>
</html>
