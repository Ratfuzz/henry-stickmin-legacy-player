<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SWF Player</title>
    <style>
        /* Force absolute viewport boundaries across modern mobile browsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Target the automatically generated ruffle-player element styling */
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        // Set up global definitions
        window.RufflePlayer = window.RufflePlayer || {};
        
        // FIX: Global configuration blocks internal SWF "noScale" bypass commands
        window.RufflePlayer.config = {
            scale: "showAll",       // Keeps original proportions without stretching characters
            forceScale: true,       // Forcefully blocks 'noScale' scripts inside Henry Stickmin
            letterbox: "on",        // Fills remaining space with the specified background color
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                const ruffle = window.RufflePlayer?.newest();
                
                if (!ruffle) {
                    document.body.innerHTML = "<div style='color: #ff3b30; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Ruffle Engine Load Failed</div>";
                    return;
                }

                const absoluteUrl = new URL(swfParam, window.location.href).href;
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                player.load({
                    url: absoluteUrl,
                    allowScriptAccess: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf</div>";
            }
        });
    </script>
<!-- Persistent Overlay Controls Container -->
<div id="std-mobile-overlay" style="display: none; position: fixed; bottom: 5%; left: 50%; transform: translateX(-50%); z-index: 99999; width: 90%; max-width: 420px; font-family: sans-serif; pointer-events: none;">
    
    <!-- Collapse/Expand Toggle Anchor -->
    <div style="display: flex; justify-content: center; margin-bottom: 8px; pointer-events: auto;">
        <button id="std-toggle-btn" style="width: 44px; height: 44px; background-color: rgba(30, 30, 30, 0.9); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); touch-action: manipulation; transition: transform 0.2s ease;">
            ▼
        </button>
    </div>

    <!-- Interactive Buttons Pad Tray -->
    <div id="std-button-tray" style="display: flex; justify-content: space-between; align-items: center; background-color: rgba(0, 0, 0, 0.65); padding: 15px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); pointer-events: auto; transition: all 0.2s ease-in-out;">
        <!-- Ram Action Button (K) -->
        <div style="text-align: center;">
            <button id="btn-key-k" style="width: 70px; height: 70px; background: linear-gradient(145deg, #ffffff, #dddddd); border: 3px solid #111; border-radius: 50%; font-size: 24px; font-weight: bold; color: #000; box-shadow: 0 5px 0 #999, 0 6px 10px rgba(0,0,0,0.4); touch-action: manipulation; active: transform 0.1s;">K</button>
            <div style="color: #fff; font-size: 11px; margin-top: 4px; font-weight: bold; text-shadow: 1px 1px 2px #000;">RAM</div>
        </div>

        <!-- Jump Action Button (Space) -->
        <div style="text-align: center; flex-grow: 1; margin-left: 20px;">
            <button id="btn-key-space" style="width: 100%; max-width: 180px; height: 70px; background: linear-gradient(145deg, #ffffff, #dddddd); border: 3px solid #111; border-radius: 15px; font-size: 18px; font-weight: bold; color: #000; box-shadow: 0 5px 0 #999, 0 6px 10px rgba(0,0,0,0.4); touch-action: manipulation;">SPACE</button>
            <div style="color: #fff; font-size: 11px; margin-top: 4px; font-weight: bold; text-shadow: 1px 1px 2px #000;">JUMP</div>
        </div>
    </div>
</div>

<script>
    window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const swfParam = urlParams.get('swf') || '';

        // Strict match validation for stealingthediamondgame.swf
        if (swfParam.toLowerCase().includes('stealingthediamondgame.swf')) {
            const overlay = document.getElementById('std-mobile-overlay');
            const toggleBtn = document.getElementById('std-toggle-btn');
            const buttonTray = document.getElementById('std-button-tray');
            
            const kBtn = document.getElementById('btn-key-k');
            const spaceBtn = document.getElementById('btn-key-space');

            let isCollapsed = false;

            // Make entire overlay frame wrapper active
            overlay.style.display = 'block';

            // Handle tray minimize / maximize mechanics
            const toggleMenu = () => {
                isCollapsed = !isCollapsed;
                if (isCollapsed) {
                    buttonTray.style.opacity = '0';
                    buttonTray.style.transform = 'scale(0.85) translateY(20px)';
                    buttonTray.style.pointerEvents = 'none';
                    toggleBtn.innerText = '▲';
                    toggleBtn.style.transform = 'rotate(180deg)';
                } else {
                    buttonTray.style.opacity = '1';
                    buttonTray.style.transform = 'scale(1) translateY(0)';
                    buttonTray.style.pointerEvents = 'auto';
                    toggleBtn.innerText = '▼';
                    toggleBtn.style.transform = 'rotate(0deg)';
                }
            };

            toggleBtn.addEventListener('click', toggleMenu);
            toggleBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                toggleMenu();
            });

            // Clean event dispatcher directly targets the Ruffle player instance canvas
            const fireKey = (type, keyStr, codeStr, codeNum) => {
                const kEvent = new KeyboardEvent(type, {
                    key: keyStr,
                    code: codeStr,
                    keyCode: codeNum,
                    which: codeNum,
                    bubbles: true,
                    cancelable: true
                });
                
                window.dispatchEvent(kEvent);
                const ruffleCanvas = document.querySelector('ruffle-player');
                if (ruffleCanvas) {
                    ruffleCanvas.dispatchEvent(kEvent);
                }
            };

            // Touch event mapping to mitigate typical mobile browser click delays
            const bindMobileKey = (element, keyStr, codeStr, codeNum) => {
                element.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    element.style.transform = 'translateY(4px)';
                    element.style.boxShadow = '0 1px 0 #999, 0 2px 5px rgba(0,0,0,0.4)';
                    fireKey('keydown', keyStr, codeStr, codeNum);
                });

                element.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    element.style.transform = 'translateY(0)';
                    element.style.boxShadow = '0 5px 0 #999, 0 6px 10px rgba(0,0,0,0.4)';
                    fireKey('keyup', keyStr, codeStr, codeNum);
                });
            };

            bindMobileKey(kBtn, 'k', 'KeyK', 75);
            bindMobileKey(spaceBtn, ' ', 'Space', 32);
        }
    });
</script>
</body>
</html>
