<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SWF Player</title>
    <style>
        /* Force absolute viewport boundaries across modern mobile browsers */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #ruffle-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Target the automatically generated ruffle-player element styling */
        #player, ruffle-player {
            width: 100% !important;
            height: 100% !important;
            display: block !important;
        }
    </style>
    
    <script>
        // Set up global definitions
        window.RufflePlayer = window.RufflePlayer || {};
        
        // FIX: Global configuration blocks internal SWF "noScale" bypass commands
        window.RufflePlayer.config = {
            scale: "showAll",       // Keeps original proportions without stretching characters
            forceScale: true,       // Forcefully blocks 'noScale' scripts inside Henry Stickmin
            letterbox: "on",        // Fills remaining space with the specified background color
            backgroundColor: "#000000"
        };
    </script>
    
    <!-- Load official Ruffle bundle -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <div id="ruffle-container">
        <div id="player"></div>
    </div>

    <script>
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const swfParam = urlParams.get('swf');

            if (swfParam) {
                const ruffle = window.RufflePlayer?.newest();
                
                if (!ruffle) {
                    document.body.innerHTML = "<div style='color: #ff3b30; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Ruffle Engine Load Failed</div>";
                    return;
                }

                const absoluteUrl = new URL(swfParam, window.location.href).href;
                const player = ruffle.createPlayer();
                document.getElementById("player").appendChild(player);

                player.load({
                    url: absoluteUrl,
                    allowScriptAccess: true
                });
            } else {
                document.body.innerHTML = "<div style='color: #666; font-family: -apple-system, sans-serif; text-align: center; padding-top: 20%;'>Usage: ?swf=filename.swf</div>";
            }
        });
    </script>
<!-- Fully Translucent Overlay Container (Compact & Bottom-Right Placed) -->
<div id="qte-container" style="
    position: fixed; 
    bottom: 20px; 
    right: 20px; 
    display: none; 
    gap: 10px; 
    z-index: 2147483647; 
    pointer-events: none;
">
    <!-- Smaller buttons restoring pointer events for gameplay interaction -->
    <button id="btn-k" style="pointer-events: auto; width: 50px; height: 50px; background: rgba(0,0,0,0.85); color: white; border: 1.5px solid white; border-radius: 50%; font-size: 18px; font-weight: bold; -webkit-user-select: none; user-select: none;">K</button>
    <button id="btn-space" style="pointer-events: auto; width: 85px; height: 50px; background: rgba(0,0,0,0.85); color: white; border: 1.5px solid white; border-radius: 25px; font-size: 14px; font-weight: bold; -webkit-user-select: none; user-select: none;">JUMP</button>
    <button id="btn-r" style="pointer-events: auto; width: 50px; height: 50px; background: rgba(0,0,0,0.85); color: white; border: 1.5px solid white; border-radius: 50%; font-size: 18px; font-weight: bold; -webkit-user-select: none; user-select: none;">R</button>
</div>

<script>
    (function() {
        const qteContainer = document.getElementById('qte-container');

        // Check the URL parameter for the correct game filename
        const urlParams = new URLSearchParams(window.location.search);
        const activeSwf = urlParams.get('swf') || "";
        
        // Show the buttons permanently ONLY if it matches stealingthediamondgame.swf
        if (activeSwf.toLowerCase().includes('stealingthediamondgame.swf')) {
            qteContainer.style.display = 'flex';
        } else {
            return; // Exit and leave buttons hidden for any other game
        }

        // Deep-targeting keyboard engine for Ruffle Shadow DOM elements
        function triggerKey(keyChar, keyCode) {
            const player = document.querySelector('ruffle-player');
            if (!player) return;

            // Target the raw internal canvas elements inside Ruffle's encapsulation layer
            const shadowCanvas = player.shadowRoot?.querySelector('canvas');
            const targets = [player, window, document];
            
            if (shadowCanvas) {
                targets.unshift(shadowCanvas);
                // Force focus tracking directly into the WebAssembly runtime space
                shadowCanvas.focus();
            }

            const isSpace = (keyChar === ' ');

            ['keydown', 'keyup'].forEach(eventType => {
                const eventConfig = {
                    key: isSpace ? ' ' : keyChar,
                    code: isSpace ? 'Space' : 'Key' + keyChar.toUpperCase(),
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true,
                    cancelable: true,
                    composed: true // Allows event to blast straight through Shadow DOM boundaries
                };

                const ev = new KeyboardEvent(eventType, eventConfig);
                
                // Blast the event across all active DOM structural trees
                targets.forEach(t => {
                    if (t) t.dispatchEvent(ev);
                });
            });
        }

        // Mobile touch triggers mapping K, Space, and R
        document.getElementById('btn-k').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('k', 75); });
        document.getElementById('btn-space').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey(' ', 32); });
        document.getElementById('btn-r').addEventListener('touchstart', (e) => { e.preventDefault(); triggerKey('r', 82); });
    })();
</script>
</body>
</html>
